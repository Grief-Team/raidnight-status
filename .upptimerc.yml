# Raidnight's status: the website and RaidnightBot, checked every five minutes by GitHub Actions.
# The page: https://grief-team.github.io/raidnight-status/ (RAIDNIGHT_STATUS_URL on the site).
owner: Grief-Team
repo: raidnight-status

sites:
  # /api/health answers from the site alone and never wakes the database, so a check every five
  # minutes costs nothing of Neon's free hours
  - name: Raidnight website
    url: https://raidnight.io/api/health
    slug: website
    icon: https://raidnight.io/logo-mark.png
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"ok":true'
    maxResponseTime: 10000
  # 200 while the bot is connected to Discord, 503 with the reason when not. Its address is kept in
  # the SECRET_SITE secret. The check is also the outside ping that keeps Azure's free plan from
  # unloading it (docs/bot.md, Keeping it awake).
  - name: RaidnightBot
    url: $SECRET_SITE
    slug: discord-bot
    icon: https://raidnight.io/logo-mark.png
    expectedStatusCodes:
      - 200
    maxResponseTime: 15000

# Each outage opens an issue, assigned here
assignees:
  - ivan-trajkov

status-website:
  baseUrl: /raidnight-status
  logoUrl: https://raidnight.io/logo-mark.png
  favicon: https://raidnight.io/logo-mark.png
  name: Raidnight status
  theme: dark
  introTitle: "Is **Raidnight** up?"
  introMessage: "The website and RaidnightBot, checked every five minutes. Something wrong that this page does not show? Tell us on [Discord](https://discord.gg/fMYkpa6bKp)."
  # the logo already leads back here, and a third link overflows the bar on a phone
  navbar:
    - title: Raidnight
      href: https://raidnight.io
    - title: Discord
      href: https://discord.gg/fMYkpa6bKp
